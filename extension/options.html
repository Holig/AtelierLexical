<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Options — Atelier Lexical</title>
  <style>
    :root {
      --bg: #141210;
      --card-bg: #1c1815;
      --text: #ede4d8;
      --text-muted: #9f9486;
      --accent: #d4a359;
      --accent-hover: #e0b46e;
      --border: #332920;
      --radius: 8px;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 24px;
      line-height: 1.5;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
    }
    h1 {
      font-size: 1.25rem;
      margin: 0;
      color: var(--accent);
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    .hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 8px;
    }
    input[type="url"] {
      width: 100%;
      padding: 10px 12px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.25);
      color: var(--text);
      font-size: 0.95rem;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="url"]:focus {
      border-color: var(--accent);
    }
    .actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }
    button {
      cursor: pointer;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      border: none;
      transition: background 0.2s;
    }
    .btn-primary {
      background: var(--accent);
      color: #141210;
    }
    .btn-primary:hover {
      background: var(--accent-hover);
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn-secondary:hover {
      color: var(--text);
      border-color: var(--text-muted);
    }
    .status {
      margin-top: 14px;
      font-size: 0.85rem;
      padding: 8px 12px;
      border-radius: 6px;
      display: none;
    }
    .status.success {
      display: block;
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.3);
    }
    .status.error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#d4a359" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path>
        <line x1="16" y1="8" x2="2" y2="22"></line>
        <line x1="17.5" y1="15" x2="9" y2="15"></line>
      </svg>
      <h1>Configuration — Atelier Lexical</h1>
    </div>

    <form id="options-form">
      <div class="form-group">
        <label for="baseUrl">Adresse de votre Atelier Lexical</label>
        <div class="hint">
          Indiquez l'URL locale ou distante de votre application (ex: <code>http://localhost:5173</code> en développement ou votre domaine en ligne).
        </div>
        <input type="url" id="baseUrl" name="baseUrl" required placeholder="http://localhost:5173" />
      </div>

      <div class="actions">
        <button type="submit" class="btn-primary">Enregistrer</button>
        <button type="button" id="btn-reset" class="btn-secondary">Réinitialiser par défaut</button>
      </div>

      <div id="status" class="status"></div>
    </form>
  </div>

  <script src="options.js"></script>
</body>
</html>
