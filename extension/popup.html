<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Atelier Lexical</title>
  <style>
    :root {
      --bg: #141210;
      --card-bg: #1c1815;
      --text: #ede4d8;
      --text-muted: #9f9486;
      --accent: #d4a359;
      --accent-hover: #e0b46e;
      --border: #332920;
    }
    body {
      width: 290px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    h2 {
      font-size: 1.05rem;
      margin: 0;
      color: var(--accent);
      font-family: Georgia, serif;
    }
    p {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 0 0 12px 0;
      line-height: 1.4;
    }
    .search-box {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
    }
    input {
      flex: 1;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.3);
      color: var(--text);
      font-size: 0.88rem;
      outline: none;
    }
    input:focus {
      border-color: var(--accent);
    }
    button {
      cursor: pointer;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background: var(--accent);
      color: #141210;
      font-weight: 600;
      font-size: 0.85rem;
      transition: background 0.2s;
    }
    button:hover {
      background: var(--accent-hover);
    }
    .tip {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-size: 0.76rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .tip strong {
      color: var(--accent);
    }
    .footer-links {
      display: flex;
      justify-content: space-between;
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
    }
    .footer-links a {
      color: var(--accent);
      text-decoration: none;
    }
    .footer-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#d4a359" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path>
      <line x1="16" y1="8" x2="2" y2="22"></line>
      <line x1="17.5" y1="15" x2="9" y2="15"></line>
    </svg>
    <h2>Atelier Lexical</h2>
  </div>

  <p>L'art du mot juste au creux de votre navigateur.</p>

  <form id="quick-search-form" class="search-box">
    <input type="text" id="quick-word" placeholder="Rechercher un mot..." autocomplete="off" autofocus />
    <button type="submit">Aller</button>
  </form>

  <div class="tip">
    💡 <strong>Astuce clic droit :</strong> Sur n'importe quelle page web, sélectionnez un mot puis faites un <em>clic droit &gt; « Rechercher dans l'Atelier Lexical »</em>.
  </div>

  <div class="footer-links">
    <a href="#" id="open-app">Ouvrir l'Atelier</a>
    <a href="#" id="open-options">Options</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
